[package]
name = "queue"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
ctrlc = "3.5.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
tempfile = "3.27.0"
thiserror = "2.0.20"
uuid = { version = "1.24.1", features = ["v4"] }

[[test]]
name = "run_test"
path = "tests/integration/run_test.rs"

[[test]]
name = "timeout_test"
path = "tests/integration/timeout_test.rs"

[[test]]
name = "concurrency_test"
path = "tests/integration/concurrency_test.rs"

[[test]]
name = "status_test"
path = "tests/integration/status_test.rs"

[[test]]
name = "cli_lock_test"
path = "tests/integration/cli_lock_test.rs"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
